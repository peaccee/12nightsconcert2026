<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胡志龍的十二夜 - 票券預訂</title>

<style>
:root{
--primary-blue:#1a3a5a;
--secondary-blue:#3498db;
--light-blue:#eef6fc;
--accent-blue:#2980b9;
--text-color:#2c3e50;
}

body{
font-family:"Microsoft JhengHei",sans-serif;
background:#f0f4f8;
padding:20px;
color:var(--text-color);
line-height:1.6;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(26,58,90,0.1);
}

h1{
text-align:center;
color:var(--primary-blue);
font-size:1.8em;
margin-bottom:10px;
margin-top:20px;
}

h2{
background:var(--light-blue);
padding:12px;
border-left:6px solid var(--secondary-blue);
font-size:1.1em;
margin-top:30px;
border-radius:0 4px 4px 0;
color:var(--primary-blue);
}

.discount-tag{
text-align:center;
color:#0056b3;
background:#e7f1ff;
padding:15px;
border-radius:8px;
margin-bottom:25px;
border:1px dashed var(--secondary-blue);
}

.discount-title{
font-weight:bold;
display:block;
margin-bottom:5px;
font-size:1.1em;
}

.form-group{margin-bottom:18px;}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
color:var(--primary-blue);
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #cbd5e0;
border-radius:6px;
box-sizing:border-box;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
margin:15px 0;
}

td{
padding:12px;
border-bottom:1px solid #edf2f7;
}

.venue-name{
font-weight:bold;
color:var(--primary-blue);
background:#f8fafc;
border-top:2px solid #e2e8f0;
}

.summary-box{
background:linear-gradient(135deg,#1a3a5a 0%,#2c3e50 100%);
color:white;
padding:25px;
border-radius:12px;
margin-top:30px;
}

.summary-line{
display:flex;
justify-content:space-between;
margin-bottom:8px;
font-size:1.1em;
}

.total-amount{
font-size:1.6em;
color:#ffd700;
border-top:1px solid rgba(255,255,255,0.2);
padding-top:15px;
margin-top:10px;
font-weight:bold;
}

.submit-btn{
width:100%;
padding:18px;
background:var(--secondary-blue);
color:white;
border:none;
border-radius:8px;
font-size:1.2em;
cursor:pointer;
margin-top:25px;
font-weight:bold;
}

.footer{
text-align:center;
margin-top:40px;
font-size:0.9em;
color:#718096;
line-height:1.8;
border-top:1px solid #e2e8f0;
padding-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>胡志龍 2026 鋼琴獨奏會 - 胡志龍的十二夜</h1>

<div class="discount-tag">
<span class="discount-title">購票優惠：3張8折｜4張75折｜5張以上7折</span>
<span>填此表單登記由主辦單位調票，可享『跨場次累計張數優惠』</span>
</div>

<form id="ticketForm">

<h2>購票者資訊</h2>

<div class="form-group">
<label>購票者姓名 *</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Email *</label>
<input type="email" required>
</div>

<div class="form-group">
<label>聯絡電話 *</label>
<input type="tel" required>
</div>

<h2>選擇訂購場次與張數</h2>

<table>

<tr class="venue-name"><td colspan="2">3/13 莫札特 台北</td></tr>
<tr><td>$500</td><td><select class="qty" data-price="500"></select></td></tr>
<tr><td>$800</td><td><select class="qty" data-price="800"></select></td></tr>
<tr><td>$1,200</td><td><select class="qty" data-price="1200"></select></td></tr>

<tr class="venue-name"><td colspan="2">3/22 舒伯特 台北</td></tr>
<tr><td>$500</td><td><select class="qty" data-price="500"></select></td></tr>
<tr><td>$800</td><td><select class="qty" data-price="800"></select></td></tr>
<tr><td>$1,200</td><td><select class="qty" data-price="1200"></select></td></tr>

<tr class="venue-name"><td colspan="2">3/29 蕭邦 衛武營</td></tr>
<tr><td>$400</td><td><select class="qty" data-price="400"></select></td></tr>
<tr><td>$600</td><td><select class="qty" data-price="600"></select></td></tr>
<tr><td>$1,200</td><td><select class="qty" data-price="1200"></select></td></tr>

<tr class="venue-name"><td colspan="2">3/29 李斯特 衛武營</td></tr>
<tr><td>$400</td><td><select class="qty" data-price="400"></select></td></tr>
<tr><td>$600</td><td><select class="qty" data-price="600"></select></td></tr>
<tr><td>$1,200</td><td><select class="qty" data-price="1200"></select></td></tr>

<tr class="venue-name"><td colspan="2">4/18 Gershwin 台南</td></tr>
<tr><td>$1,200</td><td><select class="qty" data-price="1200"></select></td></tr>

</table>

<div class="summary-box">
<div class="summary-line">
<span>總票數</span>
<span id="qty">0</span>
</div>

<div class="summary-line">
<span>原始金額</span>
<span id="orig">0</span>
</div>

<div class="summary-line total-amount">
<span>折扣後</span>
<span id="final">0</span>
</div>
</div>

<button class="submit-btn">送出訂單</button>

</form>
</div>

<div class="footer">
斐亞文化藝術股份有限公司
</div>

<script>

const selects=document.querySelectorAll('.qty');

selects.forEach(s=>{
for(let i=0;i<=20;i++){
let o=document.createElement('option');
o.value=i;
o.text=i;
s.appendChild(o);
}
});

function calc(){

let qty=0;
let orig=0;

selects.forEach(s=>{
let n=parseInt(s.value)||0;
let p=parseInt(s.dataset.price);
qty+=n;
orig+=n*p;
});

let rate=1;

if(qty>=5)rate=0.7;
else if(qty==4)rate=0.75;
else if(qty==3)rate=0.8;

let final=Math.round(orig*rate);

document.getElementById('qty').innerText=qty;
document.getElementById('orig').innerText=orig;
document.getElementById('final').innerText=final;

}

selects.forEach(s=>s.addEventListener('change',calc));

</script>

</body>
</html>
